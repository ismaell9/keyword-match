[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-doc-qa"
version = "0.1.0"
description = "Document Q&A service with citations: hybrid retrieval (BM25 + vectors, RRF, cross-encoder) plus measured evaluation and an abstention gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohamed Ahmed Ismail" }]
keywords = ["rag", "retrieval", "bm25", "sqlite-vec", "fastembed", "evaluation", "citations"]

# Runtime deps are pinned in requirements.txt for reproducibility; this list is
# the packaging view and stays loose so `pip install -e .` resolves locally.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "httpx>=0.27",
    "pypdf>=4.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The real embedding/reranking path. Without these the service still runs on the
# labelled hash stub, but retrieval quality is meaningless.
models = ["fastembed>=0.4"]
# The intended production vector index. Without it the numpy fallback is used.
vectors = ["sqlite-vec>=0.1.6"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ragqa = "ragqa.api:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
